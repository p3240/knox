name: ConvertMeasurements
# optional list of dependencies to be included
# "#" is is part of the config - do not remove
# requires: <plugin ID>
description: Adds button to convert weight, height, and penis length fields on the performer edit page
version: 1.0
url: https://github.com/p3240/knox/blob/main/plugins/Convert%20Measurements.js

ui:
  javascript:
    - https://github.com/p3240/knox/blob/main/plugins/Convert%20Measurements.js
    - ConvertMeasurements.js

# map of setting names to be displayed in the plugins page in the UI
settings: ConvertMeasurements
  # internal name
  foo: ConvertMeasurements
  # name to display in the UI
  displayName: Convert Measurements
  # type of the attribute to show in the UI
  # can be BOOLEAN, NUMBER, or STRING
  type: BOOLEAN
